<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Circle -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#0f172a" stroke="url(#pulseGrad)" stroke-width="4" />

  <!-- Medical Cross + Pulse Heart Beat Line -->
  <g filter="url(#glow)">
    <!-- Pulse ECG Line -->
    <path d="M 20 50 L 34 50 L 40 32 L 48 68 L 56 24 L 64 58 L 70 50 L 80 50" 
          fill="none" 
          stroke="url(#pulseGrad)" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Pulse Dot Indicator -->
    <circle cx="56" cy="24" r="4" fill="#14b8a6" />
  </g>
</svg>